<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Nyla AutoPost – Social Media Automation{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-gray-950 via-gray-900 to-slate-950 text-gray-100 min-h-screen flex flex-col font-sans antialiased">

    <!-- NAVIGATION BAR -->
    <nav class="bg-gray-900/90 backdrop-blur-md border-b border-gray-800 sticky top-0 z-50 px-6 py-4 flex justify-between items-center shadow-xl">
        <a href="{{ url_for('dashboard') if current_user.is_authenticated else url_for('index') }}" class="flex items-center gap-3 group">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-pink-500 flex items-center justify-center text-white text-lg font-black shadow-lg shadow-blue-500/30 group-hover:scale-105 transition">
                N
            </div>
            <span class="text-xl font-extrabold tracking-tight text-white group-hover:text-blue-400 transition">
                Nyla <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-indigo-400 to-pink-400">AutoPost</span>
            </span>
        </a>

        {% if current_user.is_authenticated %}
        <div class="hidden md:flex items-center gap-1 bg-gray-800/80 p-1.5 rounded-2xl border border-gray-700/60 text-sm">
            <a href="{{ url_for('dashboard') }}" class="px-4 py-2 rounded-xl text-gray-300 hover:text-white hover:bg-gray-700/60 font-medium transition flex items-center gap-2">
                <i class="fa-solid fa-chart-pie"></i> Dashboard
            </a>
            <a href="{{ url_for('compose') }}" class="px-4 py-2 rounded-xl text-gray-300 hover:text-white hover:bg-gray-700/60 font-medium transition flex items-center gap-2">
                <i class="fa-solid fa-pen-nib"></i> Compose
            </a>
            <a href="{{ url_for('analytics') }}" class="px-4 py-2 rounded-xl text-gray-300 hover:text-white hover:bg-gray-700/60 font-medium transition flex items-center gap-2">
                <i class="fa-solid fa-chart-line"></i> Analytics
            </a>
            <a href="{{ url_for('settings') }}" class="px-4 py-2 rounded-xl text-gray-300 hover:text-white hover:bg-gray-700/60 font-medium transition flex items-center gap-2">
                <i class="fa-solid fa-gear"></i> Settings
            </a>
        </div>
        <div>
            <a href="{{ url_for('logout') }}" class="px-4 py-2.5 rounded-xl bg-red-600/10 border border-red-500/30 text-red-400 hover:bg-red-600 hover:text-white font-bold text-xs uppercase tracking-wider transition flex items-center gap-2">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </a>
        </div>
        {% else %}
        <div class="flex items-center gap-3">
            <a href="{{ url_for('login') }}" class="text-sm text-gray-300 hover:text-white font-medium px-3 py-2">Sign In</a>
            <a href="{{ url_for('register') }}" class="text-sm bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold px-5 py-2.5 rounded-xl transition shadow-lg shadow-blue-600/30">
                Get Started
            </a>
        </div>
        {% endif %}
    </nav>

    <!-- MAIN CONTENT CONTAINER -->
    <main class="flex-grow container mx-auto px-4 py-8 max-w-6xl">
        {% block content %}{% endblock %}
    </main>

    <!-- FOOTER -->
    <footer class="border-t border-gray-800/80 bg-gray-950 py-6 text-center text-xs text-gray-500">
        &copy; 2026 Nyla AutoPost. All rights reserved.
    </footer>

</body>
</html>
