{% extends "base.html" %}
{% block title %}Login – Nyla AutoPost{% endblock %}

{% block content %}
<div class="bg-gray-900/80 p-8 rounded-3xl border border-gray-800 shadow-2xl max-w-md mx-auto space-y-6">
    <div class="text-center space-y-2">
        <h1 class="text-2xl font-black text-white">Welcome Back</h1>
        <p class="text-gray-400 text-xs">Sign in to manage your scheduled posts and automation.</p>
    </div>

    <form method="POST" class="space-y-4">
        <div>
            <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-2">Email Address</label>
            <input type="email" name="email" required class="w-full px-4 py-3 rounded-2xl bg-gray-950 border border-gray-800 text-white focus:border-blue-500 focus:outline-none text-sm" placeholder="you@example.com">
        </div>
        <div>
            <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-2">Password</label>
            <input type="password" name="password" required class="w-full px-4 py-3 rounded-2xl bg-gray-950 border border-gray-800 text-white focus:border-blue-500 focus:outline-none text-sm" placeholder="••••••••">
        </div>

        <button type="submit" class="w-full bg-gradient-to-r from-blue-600 via-indigo-600 to-pink-600 hover:opacity-90 text-white font-extrabold py-3.5 rounded-2xl transition shadow-xl shadow-blue-600/20 text-xs uppercase tracking-wider">
            Sign In
        </button>
    </form>

    <div class="text-center text-xs text-gray-400 pt-2 border-t border-gray-800">
        Don't have an account? <a href="{{ url_for('register') }}" class="text-blue-400 hover:underline font-bold">Register here</a>
    </div>
</div>
{% endblock %}
