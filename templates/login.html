{% extends "base.html" %}
{% block title %}Login - AutoPost{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-10 bg-gray-800 p-8 rounded-xl border border-gray-700 shadow-xl">
    <h2 class="text-2xl font-bold mb-6 text-center text-white">Welcome Back</h2>
    <form method="POST" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-300 mb-1">Email</label>
            <input type="email" name="email" required class="w-full px-4 py-2 rounded-lg bg-gray-900 border border-gray-600 text-white focus:border-blue-500 focus:outline-none" placeholder="you@example.com">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-300 mb-1">Password</label>
            <input type="password" name="password" required class="w-full px-4 py-2 rounded-lg bg-gray-900 border border-gray-600 text-white focus:border-blue-500 focus:outline-none" placeholder="••••••••">
        </div>
        <button type="submit" class="w-full py-2 px-4 bg-blue-600 hover:bg-blue-500 font-semibold rounded-lg text-white transition">Sign In</button>
    </form>
    <p class="mt-4 text-center text-sm text-gray-400">
        Don't have an account? <a href="{{ url_for('register') }}" class="text-blue-400 hover:underline">Register here</a>
    </p>
</div>
{% endblock %}
