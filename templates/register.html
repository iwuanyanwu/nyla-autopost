{% extends "base.html" %}
{% block title %}Create an Account - Nyla AutoPost{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-12 p-8 bg-gray-900/80 border border-gray-800 rounded-3xl shadow-2xl space-y-6">
    <div class="text-center space-y-2">
        <h1 class="text-2xl font-black text-white">Create Your Account</h1>
        <p class="text-gray-400 text-xs">Start broadcasting across all platforms with smart limit validation.</p>
    </div>

    <form method="POST" action="{{ url_for('login') }}" class="space-y-4">
        <div>
            <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-2">Full Name</label>
            <input type="text" name="name" required class="w-full px-4 py-3 rounded-2xl bg-gray-950 border border-gray-800 text-white focus:border-blue-500 focus:outline-none text-sm" placeholder="Alex Bautista">
        </div>

        <div>
            <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-2">Email Address</label>
            <input type="email" name="email" required class="w-full px-4 py-3 rounded-2xl bg-gray-950 border border-gray-800 text-white focus:border-blue-500 focus:outline-none text-sm" placeholder="you@example.com">
        </div>

        <div>
            <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-2">Password</label>
            <input type="password" name="password" required class="w-full px-4 py-3 rounded-2xl bg-gray-950 border border-gray-800 text-white focus:border-blue-500 focus:outline-none text-sm" placeholder="••••••••">
        </div>

        <div>
            <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-2">Confirm Password</label>
            <input type="password" name="confirm_password" required class="w-full px-4 py-3 rounded-2xl bg-gray-950 border border-gray-800 text-white focus:border-blue-500 focus:outline-none text-sm" placeholder="••••••••">
        </div>

        <button type="submit" class="w-full bg-gradient-to-r from-blue-600 via-indigo-600 to-pink-600 hover:opacity-90 text-white font-extrabold py-3.5 rounded-2xl transition shadow-lg shadow-blue-600/20 text-sm uppercase tracking-wider mt-2">
            Get Started Free
        </button>
    </form>

    <div class="text-center text-xs text-gray-400">
        Already have an account? 
        <a href="{{ url_for('login') }}" class="text-blue-400 font-bold hover:underline ml-1">Sign in here</a>
    </div>
</div>
{% endblock %}
