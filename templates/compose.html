{% extends "base.html" %}
{% block title %}Compose Post - Nyla AutoPost{% endblock %}
{% block content %}
<div class="bg-gray-900/80 p-8 rounded-3xl border border-gray-800 shadow-2xl max-w-2xl mx-auto space-y-6">
    <div>
        <h1 class="text-2xl font-black text-white">Create & Broadcast</h1>
        <p class="text-gray-400 text-xs mt-1">Compose content with multi-platform publishing.</p>
    </div>

    <form action="/compose" method="POST" enctype="multipart/form-data" class="space-y-6">
        <!-- CONTENT TEXTAREA -->
        <div>
            <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-2">Post Message</label>
            <textarea name="content" rows="4" class="w-full px-4 py-3 rounded-2xl bg-gray-950 border border-gray-800 text-white focus:border-blue-500 focus:outline-none placeholder-gray-600 text-sm leading-relaxed" placeholder="Write something engaging..." required></textarea>
        </div>

        <!-- TARGET PLATFORMS -->
        <div>
            <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-3">Target Networks</label>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                <label class="flex items-center justify-center gap-2 p-3 bg-gray-950 border border-gray-800 rounded-2xl cursor-pointer hover:border-blue-500 transition">
                    <input type="checkbox" name="platforms" value="facebook" checked class="rounded text-blue-600 focus:ring-0">
                    <span class="text-xs font-bold text-gray-300">Facebook</span>
                </label>
                <label class="flex items-center justify-center gap-2 p-3 bg-gray-950 border border-gray-800 rounded-2xl cursor-pointer hover:border-pink-500 transition">
                    <input type="checkbox" name="platforms" value="instagram" class="rounded text-pink-500 focus:ring-0">
                    <span class="text-xs font-bold text-gray-300">Instagram</span>
                </label>
                <label class="flex items-center justify-center gap-2 p-3 bg-gray-950 border border-gray-800 rounded-2xl cursor-pointer hover:border-blue-400 transition">
                    <input type="checkbox" name="platforms" value="linkedin" class="rounded text-blue-400 focus:ring-0">
                    <span class="text-xs font-bold text-gray-300">LinkedIn</span>
                </label>
                <label class="flex items-center justify-center gap-2 p-3 bg-gray-950 border border-gray-800 rounded-2xl cursor-pointer hover:border-gray-400 transition">
                    <input type="checkbox" name="platforms" value="x" checked class="rounded text-white focus:ring-0">
                    <span class="text-xs font-bold text-gray-300">X</span>
                </label>
            </div>
        </div>

        <!-- PUBLISH OPTIONS -->
        <div class="border-t border-gray-800 pt-6">
            <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-3">Publish Schedule</label>
            <div class="grid grid-cols-2 gap-4">
                <label class="flex items-center justify-center gap-2 p-3 bg-gray-950 border border-gray-800 rounded-2xl cursor-pointer hover:border-blue-500 transition">
                    <input type="radio" name="post_type" value="now" checked onclick="document.getElementById('schedule_picker').classList.add('hidden')" class="text-blue-600">
                    <span class="text-xs font-bold text-white">Immediate</span>
                </label>
                <label class="flex items-center justify-center gap-2 p-3 bg-gray-950 border border-gray-800 rounded-2xl cursor-pointer hover:border-blue-500 transition">
                    <input type="radio" name="post_type" value="schedule" onclick="document.getElementById('schedule_picker').classList.remove('hidden')" class="text-blue-600">
                    <span class="text-xs font-bold text-white">Schedule</span>
                </label>
            </div>
        </div>

        <!-- DATETIME PICKER & TIMEZONE -->
        <div id="schedule_picker" class="hidden space-y-3">
            <div>
                <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-1">Date & Time</label>
                <input type="datetime-local" name="scheduled_at_local" class="w-full px-4 py-3 rounded-2xl bg-gray-950 border border-gray-800 text-white focus:border-blue-500 focus:outline-none text-sm">
            </div>
            <!-- Auto-detected Timezone Offset -->
            <input type="hidden" name="tz_offset" id="tz_offset" value="0">
        </div>

        <!-- SUBMIT BUTTON -->
        <button type="submit" class="w-full bg-gradient-to-r from-blue-600 via-indigo-600 to-pink-600 text-white font-extrabold py-4 rounded-2xl transition shadow-xl shadow-blue-600/20 text-sm uppercase tracking-wider">
            Broadcast Content
        </button>
    </form>
</div>

<script>
// Automatically pass the phone's timezone offset in minutes to Flask
document.getElementById('tz_offset').value = new Date().getTimezoneOffset();
</script>
{% endblock %}
